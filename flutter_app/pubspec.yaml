name: folia_native
description: Native Flutter Folia client, isolated from the original Android app.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: 1.5.0
  just_audio: 0.10.6
  just_audio_background: 0.0.1-beta.17
  audio_session: 0.2.4
  shared_preferences: 2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  yaml: 3.1.4

flutter:
  uses-material-design: true
